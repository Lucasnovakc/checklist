<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0A0A">
  <title>Checklist Barão</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Checklist">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="sem-login">
  <header class="app-topo">
    <img class="app-logo" src="logo.png" alt="Barão Bar">
    <span class="app-quem" id="quem"></span>
    <button type="button" class="btn-sair" data-sair>Sair</button>
  </header>
  <div id="faixa-offline" class="faixa-offline" role="status" hidden></div>
  <main id="tela"></main>
  <nav class="app-nav" aria-label="Telas">
    <button type="button" class="btn-nav" data-nav="hoje">Hoje</button>
    <button type="button" class="btn-nav" data-nav="acompanhar" data-perfil="lider" hidden>Acompanhar</button>
    <button type="button" class="btn-nav" data-nav="historico" data-perfil="lider" hidden>Histórico</button>
    <button type="button" class="btn-nav" data-nav="cadastro" data-perfil="gerente" hidden>Cadastro</button>
  </nav>
  <dialog id="dialogo"></dialog>
  <dialog id="formulario"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="regras.js"></script>
  <script src="fila.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="nuvem.js"></script>
  <script src="app.js"></script>
  <script src="login.js"></script>
  <script src="hoje.js"></script>
  <script src="acompanhar.js"></script>
  <script src="historico.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
